name: "Edit YAML file"
description: "Edit the paper list, partner logos, or social links. Drag logos into the issue after it opens."
title: "YAML Edit: "
labels: ["yml-edit"]
body:
  - type: markdown
    attributes:
      value: |
        After you submit, this issue is filled with **one box per item**.

        - Partner logos: drag into that partner's text box → saved to `assets/img/partners/`
        - **Delete an item:** remove that whole `#### Publication:` / `#### Partner:` / `#### Link:` block
        - **Reorder:** cut and paste whole blocks
        - You do **not** need a separate Upload Images issue for logos
  - type: dropdown
    id: yml_file
    attributes:
      label: "Which YAML file do you want to edit?"
      description: "Filename stays the same. The note in brackets is what that file usually changes."
      options:
        - "_data/publication.yml (paper list, also feeds the Applications page)"
        - "_data/orgs.yml (partner logos)"
        - "_data/social_media.yml (social icons)"
    validations:
      required: true
  - type: textarea
    id: comment
    attributes:
      label: "Additional comment"
      description: "Anything else you'd like to note"
      placeholder: "Optional comment..."
    validations:
      required: false
