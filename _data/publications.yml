- title: "The climate, land, energy, and water systems (CLEWs) framework: a retrospective of activities and advances to 2019"
  authors: Ramos et al.
  year: "2021"
  journal: Environmental Research Letters
  url: "https://doi.org/10.1088/1748-9326/abd34f"
  abstract: Population growth, urbanization and economic development drive the use of resources. Securing access to essential services such as energy, water, and food, while achieving sustainable development, require that policy and planning processes follow an integrated approach. The ‘Climate-, Land-, Energy- and Water-systems’ (CLEWs) framework assists the exploration of interactions between (and within) CLEW systems via quantitative means. The approach was first introduced by the International Atomic Energy Agency to conduct an integrated systems analysis of a biofuel chain. The framework assists the exploration of interactions between (and within) CLEW systems via quantitative means. Its multi-institutional application to the case of Mauritius in 2012 initiated the deployment of the framework. A vast number of completed and ongoing applications of CLEWs span different spatial and temporal scales, discussing two or more resource interactions under different political contexts. Also,
    the studies vary in purpose. This shapes the methods that support CLEWs-type analyses. In this paper, we detail the main steps of the CLEWs framework in perspective to its application over the years. We summarise and compare key applications, both published in the scientific literature, as working papers and reports by international organizations. We discuss differences in terms of geographic scope, purpose, interactions represented, analytical approach and stakeholder involvement. In addition, we review other assessments, which contributed to the advancement of the CLEWs framework. The paper delivers recommendations for the future development of the framework, as well as keys to success in this type of evaluations.
- title: Climate, Land, Energy and Water systems interactions – From key concepts to model implementation with OSeMOSYS
  authors: Ramos et al.
  year: "2022"
  journal: Environmental Science and Policy
  url: "https://doi.org/10.1016/j.envsci.2022.08.013"
  abstract: The Climate, Land, Energy and Water systems (CLEWs) approach guides the development of integrated assessments. The approach includes an analytical component that can be performed using simple accounting methods, soft-linking tools, incorporating cross-systems considerations in sectoral models, or using one modelling tool to represent CLEW systems. This paper describes how a CLEWs quantitative analysis can be performed using one single modelling tool, the Open Source Energy Modelling System (OSeMOSYS). Although OSeMOSYS was primarily developed for energy systems analysis, the tool’s functionality and flexibility allow for its application to CLEWs. A step-by-step explanation of how climate, land, energy, and water systems can be represented with OSeMOSYS, complemented with the interpretation of sets, parameters, and variables in the OSeMOSYS code, is provided. A hypothetical case serves as the basis for developing a modelling exercise that exemplifies the building of a CLEWs model
    in OSeMOSYS. System-centred scenario analysis is performed with the integrated model example to illustrate its application. The analysis of results shows how integrated insights can be derived from the quantitative exercise in the form of conflicts, trade-offs, opportunities, and synergies. In addition to the modelling exercise, using the OSeMOSYS-CLEWs example in teaching, training and open science is explored to support knowledge transfer and advancement in the field.
- title: "Analysing the development of the climate, land, energy, and water systems (CLEWs) modelling framework: a state-of-the-art review"
  authors: Alexander et al.
  year: "2025"
  journal: Environmental Research Climate
  url: "https://iopscience.iop.org/article/10.1088/2752-5295/adf504"
  abstract: "This comprehensive state-of-the-art literature review explores recent scientific developments in climate, land, energy, and water systems (CLEWs) modelling by systematically analysing 41 peer-reviewed studies published between 2020 and 2024. This research uncovered insights into the evolving interdisciplinary landscape, revealing various trends, such as approximately 74% of studies publishing their data as open-access and 50% employing an open-source analytical tool, or tools, in combination with open-access data. This study identified four areas of significance: (1) the connections between CLEWs and the sustainable development goals, (2) how the CLEWs framework is linked to capacity development, (3) the critical interplay between energy and water systems, and (4) the transformative potential for comprehensive system integration using the CLEWs modelling framework. By pinpointing promising research directions such as soft-linking CLEWs models with geographic information systems,\
    \ applying robust decision making methodologies, adapting the CLEWs framework to the city level, and highlighting the need to assess real world impact of CLEWs research, the review provides a strategic roadmap for future interdisciplinary research. Notably, the analysis emphasised the urgent need for enhanced institutional coordination and collaborative communities of practice, particularly for open-source modelling tools like the open-source energy modelling system, to further accelerate knowledge dissemination and foster innovative, integrated approaches to complex systemic challenges."
- title: "Empowering Tomorrow’s Problem Solvers: Nexus Thinking and CLEWs Modelling as a Pedagogical Approach to Wicked Problems"
  authors: Martindale et al.
  year: "2023"
  journal: Energies
  url: "https://doi.org/10.3390/en16145539"
  abstract: The increasing prevalence of wicked problems, such as climate change, requires a transformation in education that equips students with the skills, competencies and knowledge to address these complex challenges. Wicked problems are characterised by their incomplete, contradictory, and ever-changing requirements, rendering them difficult to resolve due to intricate interdependencies. Nexus thinking offers a valuable approach to these problems, as it emphasises the interconnectedness of various systems, fostering a more comprehensive understanding of the challenges at hand. In this paper, we propose the use of Climate, Land, Energy, and Water (CLEWs) modelling as an innovative pedagogical strategy tool to cultivate nexus thinking among students. Building upon the pioneering CLEWs pedagogical work of Shivakumar et al., in their ‘Introduction to CLEWs’ Open Learn course, we demonstrate how this approach can be utilised in a Higher Education (HE) setting in the form of a Masters’ module
    for geography students.
- title: Uganda’s Hydropower System Resilience to Extreme Climate Variability
  authors: Mujjuni et al.
  year: "2023"
  journal: Climate
  url: "https://doi.org/10.3390/cli11090177"
  abstract: "This study was motivated by the high reliance on hydropower plants (HPPs) developed and planned along the river Nile and the fact that drought events are the most imminent and drastic threats to Uganda’s power production. The study aimed to assess HPPs’ resilience and the effectiveness of selected adaptation measures. The climate, land, energy, and water system (CLEWs) framework was employed to assess resilience amidst competing water demands and stringent environmental flow requirements. Under extreme dry conditions, power generation could plummet by 91% over the next 40 years, which translates into an annual per capita consumption of 19 kWh, barely sufficient to sustain a decent socioeconomic livelihood. During arid conditions, climate models predicted an increase in streamflow with increasing radiative forcing. Restricting the ecological flow to 150 m3/s could improve generation by 207%. In addition, if planned power plants were to be built 5 years ahead of schedule, the\
    \ normalized mean annual plant production could increase by 23%. In contrast, increasing reservoir volumes for planned power plants will have no significant impact on generation. The path to HPP resilience could entail a combination of diversifying the generation mix, installing generators with varying capacities, and incorporating adjustable orifices on reservoirs."
- title: The regional employment implications of a net-zero economy in Costa Rica under uncertainty
  authors: Chacon et al.
  year: "2023"
  journal: Advances in Climate Science Research
  url: "https://doi.org/10.1016/j.eng.2023.05.015"
  abstract: "This study estimates job creation from Costa Rica's transition to net-zero emissions by 2050, contrasting it with a business-as-usual scenario (BAU) using employment multipliers from Costa Rica’s input–output matrix. The model is soft-linked with a bottom-up technology‒rich regional model of the CLEW sectors in Costa Rica. A robust decision-making-inspired approach is taken to assess the effects of uncertainty on the estimations. The study addresses a literature gap in modeling subnational employment while accounting for long-term uncertainty and allows to identify economic activities affected by the transformation, so that policies regarding a just transition can be properly developed and stakeholders incentivized to take active participation in the process. Under baseline assumptions, a net-zero economy would have 135 thousand more jobs by 2050 than the BAU, equivalent to 7% of the employed population in 2017. Energy-related jobs would triple by mid-21st century, and regions\
    \ capitalizing on renewables would perceive the highest gain. When considering uncertainty, the net jobs range between 35‒750 thousand. Since net positive outcomes in terms of jobs are feasible, global governance should focus efforts on policies that enhance these."
- title: Applying the open-source climate, land, energy, and water systems (CLEWs) model to Canada
  authors: Kuling et al.
  year: "2022"
  journal: Energy Strategy Reviews
  url: "https://doi.org/10.1016/j.esr.2022.100773"
  abstract: In this paper the Climate, Land, Energy, and Water system (CLEWs) interactions of biofuels production are addressed. We utilize an open-source modelling framework to assess direct and indirect impacts of biofuels on long-term electricity generation, land, and water use. We analyse a switchgrass biofuels pathway and find that while the land use implications are substantial, increasing by 646,190 km 2 in agricultural land area, the impacts on water systems, which increases by approximately 222 billion m 3 compared to the baseline, may be even more limiting for the Canadian context. While switchgrass biofuels can contribute low-carbon dispatchable electricity, the land and water use impacts suggest that any biofuels should be used for hard to decarbonize sectors prior to using them for electricity.
- title: The Global Least-cost user-friendly CLEWs Open-Source Exploratory model
  authors: Beltramo et al.
  year: "2021"
  journal: Environmental Modelling and Software
  url: "https://doi.org/10.1016/j.envsoft.2021.105086"
  abstract: Integrated Assessment Models (IAMs) are important tools to analyse cross-sectoral interdependencies and the use of global resources. Most current tools are highly detailed and require expert knowledge and proprietary software to generate scenarios and analyse their insights. In this paper, the complementary Global Least-cost User-friendly CLEWs Open-Source Exploratory (GLUCOSE) model is presented as a highly-aggregated global IAM, open and accessible from source to solver and using the OSeMOSYS tool and the CLEWs framework. The model enables the exploration of policy measures on the future development of the integrated resource system. Thanks to its relatively simple structure, it requires low computational resources allowing for the generation of a large number of scenarios or to quickly conduct preliminary investigations. GLUCOSE is targeted towards education and training purposes by a range of interested parties, from students to stakeholders and decision-makers, to explore
    possible future pathways towards the sustainable management of global resources.
- title: "Climate-Land-Energy-Water Nexus Models Across Scales: Progress, Gaps and Best Accessibility Practices"
  authors: Vinca et al.
  year: "2021"
  journal: Frontiers in Envrionmental Science
  url: "https://doi.org/10.3389/fenvs.2021.691523"
  abstract: Approaches that integrate feedback between climate, land, energy and water (CLEW) have progressed significantly in scope and complexity. The so-called nexus approaches have shown their usefulness in assessing strategies to achieve the Sustainable Development Goals in the contexts of increasing demands, resource scarcity, and climate change. However, most nexus analyses omit some important inter-linkages that could actually be addressed. The omissions often stem from technical and practical considerations, but also from limited dissemination of new open-source frameworks incorporating recent advances. We review and present a set of models that can meet the needs of decision makers for analysis tools capable of addressing a broad range of nexus questions. Particular attention is given to model accessibility, usability and community support. The other objective of this review is to discuss research gaps, and critical needs and opportunities for further model development from a scientific
    viewpoint. We explore at different scales where and why some nexus interactions are most relevant. We find that both very small scale and global models tend to neglect some CLEW interactions, but for different reasons. The former rarely include climate impacts, which are often marginal at the local level, while the latter mostly lack some aspects because of the complexity of large full CLEW systems at the global level.
- title: "Smart Climate Resilient and Efficient Integrated Waste to Clean Energy System in a Developing Country: Industry 4.0"
  authors: Njuguna et al.
  year: "2021"
  journal: African Handbook of Climate Change Adaptation
  url: "https://doi.org/10.1007/978-3-030-45106-6_69"
  abstract: Climate change impacts a natural and human system on the entire globe. Climate-related extreme weather such as drought, floods, and heat waves alters the ecosystems that society depends on. Climate, land, energy, and water systems (CLEWS) are a critical aspect of high importance on resource availability, distribution, and interconnection. The nexus provides a set of guidelines to South Africa that aims on creating a level playing field for all sectors while achieving the aims of the SDGs that are cross-sectoral and multilevel approaches to climate change. The nexus expressed three domains that included resources, governance, and security. It integrated a smart climate resilient with inclusion of the governance and involvement of the stakeholders. Recognition of spatial and sector interdependencies should inform policies, investment and institutional for enhancing nexus security and climate change towards making transition green carbon deals. The nexus offers an integrated approach
    that analyzes the trade-offs and synergies between the different sectors in order to maximize the efficiency of using the resources that adapt institutional and optimum policy arrangements. Economic transformation and creation of employment through green economy is one of the COP26 green deal agendas in curbing the carbon emissions (green house emission, industrial processes, fuel combustion, and fugitive emissions) as mitigation to climate change, which is cost-effective and economically efficient. The future climate change policy in the developing countries is likely to be both promoted by climate technology transfer and public-private cooperation (cross-sector partnership) through the technology mechanism of the nexus and inclusion of the gender.
- title: A clustering approach to improve spatial representation in water-energy-food models
  authors: Shivakumar et al.
  year: "2021"
  journal: Environmental Research Letters
  url: "https://doi.org/10.1088/1748-9326/ac2ce9"
  abstract: "Currently available water-energy-food (WEF) modelling frameworks to analyse cross-sectoral interactions often share one or more of the following gaps: (a) lack of integration between sectors, (b) coarse spatial representation, and (c) lack of reproducible methods of nexus assessment. In this paper, we present a novel clustering tool as an expansion to the Climate-Land-Energy-Water-Systems modelling framework used to quantify inter-sectoral linkages between water, energy, and food systems. The clustering tool uses Agglomerative Hierarchical clustering to aggregate spatial data related to the land and water sectors. Using clusters of aggregated data reconciles the need for a spatially resolved representation of the land-use and water sectors with the computational and data requirements to efficiently solve such a model. The aggregated clusters, combined together with energy system components, form an integrated resource planning structure. The modelling framework is underpinned\
    \ by an open-source energy system modelling tool—OSeMOSYS—and uses publicly available data with global coverage. By doing so, the modelling framework allows for reproducible WEF nexus assessments. The approach is used to explore the inter-sectoral linkages between the energy, land-use, and water sectors of Viet Nam out to 2030. A validation of the clustering approach confirms that underlying trends actual crop yield data are preserved in the resultant clusters. Finally, changes in cultivated area of selected crops are observed and differences in levels of crop migration are identified."
- title: Land, energy and water resource management and its impact on GHG emissions, electricity supply and food production- Insights from a Ugandan case study
  authors: Sridharan et al.
  year: "2020"
  journal: Environmental Research Communications
  url: "https://doi.org/10.1088/2515-7620/abaf38"
  abstract: Despite the excitement around the nexus between land, energy and water resource systems, policies enacted to govern and use these resources are still formulated in isolation, without considering the interdependencies. Using a Ugandan case study, we highlight the impact that one policy change in the energy system will have on other resource systems. We focus on deforestation, long term electricity supply planning, crop production, water consumption, land-use change and climate impacting greenhouse gas (GHG) trajectories. In this study, an open-source integrated modelling framework is used to map the ripple effects of a policy change related to reducing biomass consumption. We find that, despite the reduction in deforestation of woodlands and forests, the GHG emissions in the power sector are expected to increase in between 2040–2050, owing to higher fossil fuel usage. This policy change is also likely to increase the cost of electricity generation, which in turn affects the agricultural
    land types. There is an unforeseen shift from irrigated to rainfed type land due to higher electricity costs. With this integrated model setup for Uganda, we highlight the need for integrated policy planning that takes into consideration the interlinkages between the resource systems and cross propagation effects.
- title: "Embedding the United Nations sustainable development goals into energy systems analysis: expanding the food–energy–water nexus"
  authors: Niet et al.
  year: "2020"
  journal: Energy, Sustainability and Society
  url: "https://doi.org/10.1186/s13705-020-00275-0"
  abstract: (Background) There have been numerous studies that consider the nexus interactions between energy systems, land use, water use and climate adaptation and impacts. These studies have filled a gap in the literature to allow for more effective policymaking by considering the trade-offs between land use, energy infrastructure as well as the use of water for agriculture and providing energy services. Though these studies fill a significant gap in the modelling literature, we argue that more work is needed to effectively consider policy trade-offs between the 17 United Nations sustainable development goals (SDGs) to avoid missing important interactions.
